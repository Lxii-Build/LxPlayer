name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: VERSION_NAME
        required: false
        default: '1.0.0'
      version_code:
        description: VERSION_CODE
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: server/go.mod

      - name: 整理并下载依赖
        run: go mod tidy && go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  android:
    name: 单测并构建签名一致的 debug / release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      IN_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
      IN_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: 生成 Gradle Wrapper 9.7.0
        run: gradle wrapper --gradle-version 9.7.0 --no-daemon

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # API 37 的平台包名带小版本（android-37.0），不是 android-37。
      # 这里先查可用包再安装，避免包名猜错时整个任务停在这一步。
      - name: 安装 SDK 平台与构建工具
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          AVAILABLE=$(sdkmanager --list 2>/dev/null | sed -n '/Available Packages/,$p')
          PLATFORM=$(printf '%s\n' "$AVAILABLE" | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -1)
          BUILD_TOOLS=$(printf '%s\n' "$AVAILABLE" | grep -oE 'build-tools;37\.[0-9.]+' | sort -V | tail -1)
          if [ -z "$PLATFORM" ]; then
            echo "::error::SDK 仓库里找不到 android-37 平台包"
            sdkmanager --list 2>/dev/null | grep -E 'platforms;android-3[5-9]' | head -20
            exit 1
          fi
          if [ -z "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(printf '%s\n' "$AVAILABLE" | grep -oE 'build-tools;3[6-9]\.[0-9.]+' | sort -V | tail -1)
          fi
          echo "安装 $PLATFORM 与 $BUILD_TOOLS"
          sdkmanager --install "platform-tools" "$PLATFORM" "$BUILD_TOOLS" >/dev/null
          echo "已安装的平台："
          ls "$ANDROID_HOME/platforms"
          echo "已安装的构建工具："
          ls "$ANDROID_HOME/build-tools"

      # 正式签名密钥库从 Secret 解码落盘。Secret 未配置时跳过，
      # build.gradle.kts 会回退到随仓库提交的固定 PKCS12，
      # 仍然保证 debug 与 release 共用同一张证书。
      - name: 解码签名密钥库
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未提供 ANDROID_KEYSTORE_BASE64，将使用仓库内固定密钥库"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lxplayer.p12"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/lxplayer.p12" -nokeys -passin pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -noout 2>/dev/null; then
            echo "::error::密钥库解码失败或口令不匹配。ANDROID_KEYSTORE_BASE64 必须是一整行无换行。"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      # 先删掉可能从缓存恢复的旧截图：拿上一轮的图说「本轮已验证」
      # 比没有图更糟。删掉后若测试仍被缓存跳过，截图数量检查会直接失败。
      - name: 清理上一轮截图
        run: rm -rf app/screenshots app/build/screenshots

      - name: 运行单元测试、Lint，并同时构建 debug 与 release
        id: build
        env:
          KS_AVAILABLE: ${{ steps.keystore.outputs.available }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ARGS=(
            -PVERSION_NAME="$IN_VERSION_NAME"
            -PVERSION_CODE="$IN_VERSION_CODE"
          )
          if [ "$KS_AVAILABLE" = "true" ]; then
            ARGS+=(
              -PKEYSTORE_FILE="$RUNNER_TEMP/lxplayer.p12"
              -PKEYSTORE_PASSWORD="$KS_PASSWORD"
              -PKEY_ALIAS="$KS_ALIAS"
              -PKEY_PASSWORD="$KS_KEY_PASSWORD"
            )
          fi
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            --no-daemon \
            "${ARGS[@]}"

      # Gradle 缓存命中时只打印 FROM-CACHE，看不出跑了多少断言。
      # 把 JUnit XML 的统计汇总出来，让「测试确实在跑」有据可查。
      - name: 汇总单元测试结果
        run: |
          set -euo pipefail
          RESULTS_DIR=app/build/test-results/testDebugUnitTest
          # 构建缓存命中时 Gradle 会把 XML 从缓存恢复出来；真的没有目录
          # 说明测试任务根本没执行过，那必须红。
          if [ ! -d "$RESULTS_DIR" ]; then
            echo "::error::找不到测试结果目录 $RESULTS_DIR"
            find app/build -name 'TEST-*.xml' 2>/dev/null | head
            exit 1
          fi
          # 用 awk 从 <testsuite> 头累加，避免在 YAML 里嵌 Python heredoc
          # （缩进和 set -u 混在一起很容易把这步弄成假失败）。
          # grep 无匹配时返回 1，pipefail 下会让整步中断，所以显式兜底成 0。
          count_attr() {
            { grep -ho "$1=\"[0-9]*\"" "$RESULTS_DIR"/TEST-*.xml 2>/dev/null || true; } \
              | { grep -o '[0-9]*' || true; } \
              | awk '{sum += $1} END {print sum + 0}'
          }
          TESTS=$(count_attr tests)
          FAILURES=$(count_attr failures)
          ERRORS=$(count_attr errors)
          SKIPPED=$(count_attr skipped)
          echo "单元测试：$TESTS 个，失败 $FAILURES，错误 $ERRORS，跳过 $SKIPPED"

          # 截图数量单独确认：渲染测试若被静默跳过，产物会是空的，
          # 那时「风格已验证」就成了空话。
          SHOTS=$(ls app/screenshots/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "界面截图：$SHOTS 张"
          {
            echo "## 界面渲染"
            echo ""
            echo "导出截图 **$SHOTS** 张（见 Artifacts 里的 lxplayer-screenshots）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SHOTS" -lt 4 ]; then
            echo "::error::渲染截图不足（$SHOTS 张），界面未被真正渲染验证"
            exit 1
          fi
          {
            echo "## 单元测试"
            echo ""
            echo "共 **$TESTS** 个，失败 $FAILURES，错误 $ERRORS，跳过 $SKIPPED"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TESTS" -eq 0 ]; then
            echo "::error::一个测试都没跑，说明测试源集没有被编译"
            exit 1
          fi
          if [ "$FAILURES" -ne 0 ] || [ "$ERRORS" -ne 0 ]; then
            echo "::error::存在失败的测试"
            exit 1
          fi

      # Gradle 只在控制台打印第一条 lint 错误，逐条猜会浪费好几轮 CI。
      - name: 失败时输出完整 Lint 报告
        if: failure()
        run: |
          for f in app/build/reports/lint-results-*.txt \
                   app/build/intermediates/lint_intermediate_text_report/*/*/lint-results-*.txt; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done
          echo "===== 单测失败详情 ====="
          for f in app/build/reports/tests/testDebugUnitTest/classes/*.html; do
            [ -f "$f" ] || continue
            echo "--- $f"
          done
          find app/build/test-results -name '*.xml' -exec grep -l "<failure" {} \; 2>/dev/null \
            | while read -r x; do echo "--- $x"; cat "$x"; done

      - name: 校验 debug 与 release 签名指纹一致
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner"
            exit 1
          fi

          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$DEBUG_APK" ] || [ -z "$RELEASE_APK" ]; then
            echo "::error::缺少 APK：debug='$DEBUG_APK' release='$RELEASE_APK'"
            exit 1
          fi

          # 直接抓 64 位十六进制摘要，不依赖 apksigner 的标签文案：
          # 按字段切分曾把「certificate SHA-256 digest」当成摘要，
          # 于是两边都拿到同一个标签字符串，比对永远相等——假通过比不通过更危险。
          sha256_of() {
            "$APKSIGNER" verify --print-certs "$1" \
              | grep -i 'SHA-256 digest' \
              | grep -oiE '[0-9a-f]{64}' \
              | head -1 \
              | tr 'a-f' 'A-F'
          }

          DEBUG_SHA=$(sha256_of "$DEBUG_APK")
          RELEASE_SHA=$(sha256_of "$RELEASE_APK")

          # 长度校验是这个断言的可信度前提：提取失败必须让任务红，
          # 而不是拿两个空串比出「一致」。
          for pair in "debug:$DEBUG_SHA" "release:$RELEASE_SHA"; do
            name=${pair%%:*}
            value=${pair#*:}
            if ! printf '%s' "$value" | grep -qE '^[0-9A-F]{64}$'; then
              echo "::error::$name 的 SHA-256 提取失败（得到 '$value'）"
              echo "--- apksigner 原始输出 ---"
              "$APKSIGNER" verify --print-certs "$DEBUG_APK"
              exit 1
            fi
          done

          # 仓库内固定密钥库的指纹（keytool 的冒号格式，去掉冒号后比对）
          EXPECTED_COMMITTED="CC4A58237C47B27C872CEB947FC8E8F7211D5545688BBCA9651473A61A71C8DD"

          echo "debug   SHA-256: $DEBUG_SHA"
          echo "release SHA-256: $RELEASE_SHA"

          if [ "$DEBUG_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::debug 与 release 签名不一致：$DEBUG_SHA vs $RELEASE_SHA"
            exit 1
          fi

          if [ "$DEBUG_SHA" = "$EXPECTED_COMMITTED" ]; then
            SOURCE="仓库内固定密钥库（指纹与预期一致）"
          else
            SOURCE="Secret 注入的密钥库"
          fi

          {
            echo "## APK 签名指纹"
            echo ""
            echo "**两个变体签名一致，来源：$SOURCE**"
            echo ""
            echo "| 变体 | 文件 | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| debug | \`$DEBUG_APK\` | \`$DEBUG_SHA\` |"
            echo "| release | \`$RELEASE_APK\` | \`$RELEASE_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "签名一致（$SOURCE）"

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-debug-${{ env.IN_VERSION_NAME }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 release APK
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-release-${{ env.IN_VERSION_NAME }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 界面截图是「风格做出来了」的唯一可视证据：
      # 编译通过和单测全绿都无法说明界面长什么样。
      # 构建成功时截图必须存在（缺失说明渲染没跑，是真问题）；
      # 构建失败时不强求，否则「编译错误」会被这一步的报错盖住。
      - name: 上传界面渲染截图
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-screenshots-${{ github.sha }}
          path: android/app/screenshots/*.png
          if-no-files-found: error

      - name: 上传 R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-mapping-${{ env.IN_VERSION_NAME }}-${{ github.sha }}
          path: android/app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: warn
