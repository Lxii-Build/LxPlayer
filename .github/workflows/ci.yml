name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: VERSION_NAME
        required: false
        default: '1.0.0'
      version_code:
        description: VERSION_CODE
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: server/go.mod

      - name: 整理并下载依赖
        run: go mod tidy && go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  android:
    name: 单测并构建签名一致的 debug / release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      IN_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
      IN_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: 生成 Gradle Wrapper 9.7.0
        run: gradle wrapper --gradle-version 9.7.0 --no-daemon

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # API 37 的平台包名带小版本（android-37.0），不是 android-37。
      # 这里先查可用包再安装，避免包名猜错时整个任务停在这一步。
      - name: 安装 SDK 平台与构建工具
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          AVAILABLE=$(sdkmanager --list 2>/dev/null | sed -n '/Available Packages/,$p')
          PLATFORM=$(printf '%s\n' "$AVAILABLE" | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -1)
          BUILD_TOOLS=$(printf '%s\n' "$AVAILABLE" | grep -oE 'build-tools;37\.[0-9.]+' | sort -V | tail -1)
          if [ -z "$PLATFORM" ]; then
            echo "::error::SDK 仓库里找不到 android-37 平台包"
            sdkmanager --list 2>/dev/null | grep -E 'platforms;android-3[5-9]' | head -20
            exit 1
          fi
          if [ -z "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(printf '%s\n' "$AVAILABLE" | grep -oE 'build-tools;3[6-9]\.[0-9.]+' | sort -V | tail -1)
          fi
          echo "安装 $PLATFORM 与 $BUILD_TOOLS"
          sdkmanager --install "platform-tools" "$PLATFORM" "$BUILD_TOOLS" >/dev/null
          echo "已安装的平台："
          ls "$ANDROID_HOME/platforms"
          echo "已安装的构建工具："
          ls "$ANDROID_HOME/build-tools"

      # 正式签名密钥库从 Secret 解码落盘。Secret 未配置时跳过，
      # build.gradle.kts 会回退到随仓库提交的固定 PKCS12，
      # 仍然保证 debug 与 release 共用同一张证书。
      - name: 解码签名密钥库
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未提供 ANDROID_KEYSTORE_BASE64，将使用仓库内固定密钥库"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lxplayer.p12"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/lxplayer.p12" -nokeys -passin pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -noout 2>/dev/null; then
            echo "::error::密钥库解码失败或口令不匹配。ANDROID_KEYSTORE_BASE64 必须是一整行无换行。"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: 运行单元测试、Lint，并同时构建 debug 与 release
        env:
          KS_AVAILABLE: ${{ steps.keystore.outputs.available }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ARGS=(
            -PVERSION_NAME="$IN_VERSION_NAME"
            -PVERSION_CODE="$IN_VERSION_CODE"
          )
          if [ "$KS_AVAILABLE" = "true" ]; then
            ARGS+=(
              -PKEYSTORE_FILE="$RUNNER_TEMP/lxplayer.p12"
              -PKEYSTORE_PASSWORD="$KS_PASSWORD"
              -PKEY_ALIAS="$KS_ALIAS"
              -PKEY_PASSWORD="$KS_KEY_PASSWORD"
            )
          fi
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            --no-daemon \
            "${ARGS[@]}"

      - name: 校验 debug 与 release 签名指纹一致
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner"
            exit 1
          fi

          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$DEBUG_APK" ] || [ -z "$RELEASE_APK" ]; then
            echo "::error::缺少 APK：debug='$DEBUG_APK' release='$RELEASE_APK'"
            exit 1
          fi

          sha256_of() {
            "$APKSIGNER" verify --print-certs "$1" \
              | awk -F': ' 'BEGIN{IGNORECASE=1} /SHA-256 digest/{gsub(/ /,"",$2); print toupper($2); exit}'
          }

          DEBUG_SHA=$(sha256_of "$DEBUG_APK")
          RELEASE_SHA=$(sha256_of "$RELEASE_APK")

          {
            echo "## APK 签名指纹"
            echo ""
            echo "| 变体 | 文件 | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| debug | \`$DEBUG_APK\` | \`$DEBUG_SHA\` |"
            echo "| release | \`$RELEASE_APK\` | \`$RELEASE_SHA\` |"
            echo ""
            echo "预期指纹（仓库内固定密钥库）："
            echo "\`CC:4A:58:23:7C:47:B2:7C:87:2C:EB:94:7F:C8:E8:F7:21:1D:55:45:68:8B:BC:A9:65:14:73:A6:1A:71:C8:DD\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "debug   SHA-256: $DEBUG_SHA"
          echo "release SHA-256: $RELEASE_SHA"

          if [ -z "$DEBUG_SHA" ] || [ -z "$RELEASE_SHA" ]; then
            echo "::error::未能提取签名指纹"
            exit 1
          fi
          if [ "$DEBUG_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::debug 与 release 签名不一致"
            exit 1
          fi
          echo "签名一致"

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-debug-${{ env.IN_VERSION_NAME }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 release APK
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-release-${{ env.IN_VERSION_NAME }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 上传 R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-mapping-${{ env.IN_VERSION_NAME }}-${{ github.sha }}
          path: android/app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: warn
