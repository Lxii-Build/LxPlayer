name: CI

on:
  push:
    branches: [main, flutter-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: server/go.mod

      - name: 整理并下载依赖
        run: go mod tidy && go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  android:
    name: 测试并构建签名一致的 debug / release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      # 正式签名密钥库从 Secret 解码落盘；未配置时 build.gradle.kts 回退到
      # 随仓库提交的固定 PKCS12。两条路径都保证 debug 与 release 同证书。
      - name: 解码签名密钥库
        env:
          KEYSTORE_B64: ${{ secrets.LXPLAYER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未提供 LXPLAYER_KEYSTORE_BASE64，将使用仓库内固定密钥库"
            exit 0
          fi
          mkdir -p android/keys
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keys/injected.p12
          if ! openssl pkcs12 -in android/keys/injected.p12 -nokeys \
              -passin pass:"${{ secrets.LXPLAYER_KEYSTORE_PASSWORD }}" -noout 2>/dev/null; then
            echo "::error::密钥库解码失败或口令不匹配。LXPLAYER_KEYSTORE_BASE64 必须是一整行无换行。"
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=keys/injected.p12
          storePassword=${{ secrets.LXPLAYER_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.LXPLAYER_KEY_ALIAS }}
          keyPassword=${{ secrets.LXPLAYER_KEY_PASSWORD }}
          EOF

      - name: 单元测试
        run: flutter test --reporter expanded

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 构建 debug APK
        run: flutter build apk --debug

      - name: 校验 debug 与 release 签名指纹一致
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner"
            exit 1
          fi

          RELEASE_APK=build/app/outputs/flutter-apk/app-release.apk
          DEBUG_APK=build/app/outputs/flutter-apk/app-debug.apk
          for f in "$RELEASE_APK" "$DEBUG_APK"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少 $f"
              find build/app/outputs -name '*.apk' | head
              exit 1
            fi
          done

          # 直接抓 64 位十六进制摘要，不按字段切分——
          # 按标签切分会把「certificate SHA-256 digest」当成摘要本身，
          # 两边都拿到同一个标签字符串，比对永远相等（假通过比失败更危险）。
          sha256_of() {
            "$APKSIGNER" verify --print-certs "$1" \
              | grep -i 'SHA-256 digest' \
              | grep -oiE '[0-9a-f]{64}' \
              | head -1 \
              | tr 'a-f' 'A-F'
          }

          DEBUG_SHA=$(sha256_of "$DEBUG_APK")
          RELEASE_SHA=$(sha256_of "$RELEASE_APK")

          for pair in "debug:$DEBUG_SHA" "release:$RELEASE_SHA"; do
            name=${pair%%:*}
            value=${pair#*:}
            if ! printf '%s' "$value" | grep -qE '^[0-9A-F]{64}$'; then
              echo "::error::$name 的 SHA-256 提取失败（得到 '$value'）"
              "$APKSIGNER" verify --print-certs "$DEBUG_APK" || true
              exit 1
            fi
          done

          echo "debug   SHA-256: $DEBUG_SHA"
          echo "release SHA-256: $RELEASE_SHA"

          if [ "$DEBUG_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::debug 与 release 签名不一致：$DEBUG_SHA vs $RELEASE_SHA"
            exit 1
          fi

          EXPECTED_COMMITTED="39B3DA9AFBB9EBC70FBBF6BA75F1BC4FC2D63AA8569E1EFE7AFCB5F4F634B876"
          if [ "$DEBUG_SHA" = "$EXPECTED_COMMITTED" ]; then
            SOURCE="仓库内固定密钥库（指纹与预期一致）"
          else
            SOURCE="Secret 注入的密钥库"
          fi

          {
            echo "## APK 签名指纹"
            echo ""
            echo "**两个变体签名一致，来源：$SOURCE**"
            echo ""
            echo "| 变体 | SHA-256 |"
            echo "| --- | --- |"
            echo "| debug | \`$DEBUG_SHA\` |"
            echo "| release | \`$RELEASE_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "签名一致（$SOURCE）"

      - name: 上传 release APK
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-release-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
