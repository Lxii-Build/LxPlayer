name: CI

on:
  push:
    branches: [main, flutter-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: server/go.mod

      - name: 整理并下载依赖
        run: go mod tidy && go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  android:
    name: 测试并构建签名一致的 debug / release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 不要给这一步接 tail：截断输出会把真正的报错行丢掉，
      # 上一轮就因此看不到失败原因。
      - name: 拉取依赖
        run: flutter pub get

      # 正式签名密钥库从 Secret 解码落盘；未配置时 build.gradle.kts 回退到
      # 随仓库提交的固定 PKCS12。两条路径都保证 debug 与 release 同证书。
      - name: 解码签名密钥库
        env:
          KEYSTORE_B64: ${{ secrets.LXPLAYER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未提供 LXPLAYER_KEYSTORE_BASE64，将使用仓库内固定密钥库"
            exit 0
          fi
          mkdir -p android/keys
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keys/injected.p12
          if ! openssl pkcs12 -in android/keys/injected.p12 -nokeys \
              -passin pass:"${{ secrets.LXPLAYER_KEYSTORE_PASSWORD }}" -noout 2>/dev/null; then
            echo "::error::密钥库解码失败或口令不匹配。LXPLAYER_KEYSTORE_BASE64 必须是一整行无换行。"
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=keys/injected.p12
          storePassword=${{ secrets.LXPLAYER_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.LXPLAYER_KEY_ALIAS }}
          keyPassword=${{ secrets.LXPLAYER_KEY_PASSWORD }}
          EOF

      - name: 单元测试
        run: flutter test --reporter expanded

      # release 按 ABI 分片产出，每台设备只下载自己那一份。
      #
      # 为什么这是第一优先级：一个通用 APK 里 arm64-v8a 与 armeabi-v7a 各占约一半
      # （实测 36.3MiB + 32.7MiB，合计占包体 91%），而**任何一台手机只会用其中一个**，
      # 另一个是纯陪跑。分片不删任何架构、不砍任何功能，只是不再把两份都塞给同一台设备。
      #
      # --target-platform 限定只产出 ARM 两片（x86_64 是模拟器专用，真机全是 ARM）。
      # --obfuscate + --split-debug-info：把调试符号与标识符名从 Dart AOT 快照
      # （libapp.so，各 ABI 约 14-16MiB）里剥离出去，符号另存为 artifact 备查。
      # 崩溃栈要还原就把对应 symbol 文件喂给 `flutter symbolize`。
      - name: 构建 release APK
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: 构建 debug APK
        run: flutter build apk --debug

      - name: 报告 APK 体积构成
        run: |
          set -euo pipefail
          APK_DIR=build/app/outputs/flutter-apk
          DEBUG_APK=$APK_DIR/app-debug.apk
          {
            echo "## APK 体积"
            echo ""
            echo "| 变体 | 字节 | MiB |"
            echo "| --- | --- | --- |"
            for pair in "debug:$DEBUG_APK"; do
              name=${pair%%:*}
              path=${pair#*:}
              if [ -f "$path" ]; then
                bytes=$(stat -c%s "$path")
                mib=$(awk -v b="$bytes" 'BEGIN{printf "%.1f", b/1048576}')
                echo "| $name | $bytes | $mib |"
              else
                echo "| $name | 缺失 | - |"
              fi
            done
            # release 现在是按 ABI 分片的多个文件，逐个列出。
            for path in $APK_DIR/*-release.apk; do
              [ -f "$path" ] || continue
              name=$(basename "$path" .apk)
              bytes=$(stat -c%s "$path")
              mib=$(awk -v b="$bytes" 'BEGIN{printf "%.1f", b/1048576}')
              echo "| $name | $bytes | $mib |"
            done
            echo ""
            echo "### 各 release 分片内的 ABI 占用"
            echo ""
            echo '```'
            for path in $APK_DIR/*-release.apk; do
              [ -f "$path" ] || continue
              echo "-- $(basename "$path")"
              unzip -l "$path" 2>/dev/null | awk '
                $4 ~ /^lib\// { n=split($4,a,"/"); sz[a[2]]+=$1 }
                END { for (k in sz) printf "   %-16s %10d B  %6.1f MiB\n", k, sz[k], sz[k]/1048576 }
              ' | sort -k2 -n -r
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 校验 debug 与 release 签名指纹一致
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner"
            exit 1
          fi

          # release 现在是按 ABI 分片的多个 APK，debug 仍是一个。
          # **每一个**都必须与 debug 同指纹，否则「可互相覆盖安装」这个前提就不成立。
          APK_DIR=build/app/outputs/flutter-apk
          DEBUG_APK=$APK_DIR/app-debug.apk
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::缺少 $DEBUG_APK"
            find build/app/outputs -name '*.apk' | head
            exit 1
          fi

          RELEASE_APKS=""
          for f in $APK_DIR/*-release.apk; do
            [ -f "$f" ] || continue
            RELEASE_APKS="$RELEASE_APKS $f"
          done
          if [ -z "$RELEASE_APKS" ]; then
            echo "::error::没有找到任何 release APK（预期 $APK_DIR/*-release.apk）"
            find build/app/outputs -name '*.apk' | head
            exit 1
          fi

          # 直接抓 64 位十六进制摘要，不按字段切分——
          # 按标签切分会把「certificate SHA-256 digest」当成摘要本身，
          # 两边都拿到同一个标签字符串，比对永远相等（假通过比失败更危险）。
          sha256_of() {
            "$APKSIGNER" verify --print-certs "$1" \
              | grep -i 'SHA-256 digest' \
              | grep -oiE '[0-9a-f]{64}' \
              | head -1 \
              | tr 'a-f' 'A-F'
          }

          DEBUG_SHA=$(sha256_of "$DEBUG_APK")
          if ! printf '%s' "$DEBUG_SHA" | grep -qE '^[0-9A-F]{64}$'; then
            echo "::error::debug 的 SHA-256 提取失败（得到 '$DEBUG_SHA'）"
            "$APKSIGNER" verify --print-certs "$DEBUG_APK" || true
            exit 1
          fi
          echo "debug   SHA-256: $DEBUG_SHA"

          ROWS=""
          MISMATCH=0
          for f in $RELEASE_APKS; do
            name=$(basename "$f" .apk)
            sha=$(sha256_of "$f")
            if ! printf '%s' "$sha" | grep -qE '^[0-9A-F]{64}$'; then
              echo "::error::$name 的 SHA-256 提取失败（得到 '$sha'）"
              "$APKSIGNER" verify --print-certs "$f" || true
              exit 1
            fi
            echo "$name SHA-256: $sha"
            ROWS="$ROWS| $name | \`$sha\` |"$'\n'
            if [ "$sha" != "$DEBUG_SHA" ]; then
              echo "::error::$name 与 debug 签名不一致：$sha vs $DEBUG_SHA"
              MISMATCH=1
            fi
          done
          [ "$MISMATCH" -eq 0 ] || exit 1

          EXPECTED_COMMITTED="39B3DA9AFBB9EBC70FBBF6BA75F1BC4FC2D63AA8569E1EFE7AFCB5F4F634B876"
          if [ "$DEBUG_SHA" = "$EXPECTED_COMMITTED" ]; then
            SOURCE="仓库内固定密钥库（指纹与预期一致）"
          else
            SOURCE="Secret 注入的密钥库"
          fi

          {
            echo "## APK 签名指纹"
            echo ""
            echo "**debug 与全部 release 分片指纹一致，来源：$SOURCE**"
            echo ""
            echo "| 变体 | SHA-256 |"
            echo "| --- | --- |"
            echo "| debug | \`$DEBUG_SHA\` |"
            printf '%s' "$ROWS"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "签名一致（$SOURCE）"

      # release 是按 ABI 分片的多个文件，整目录上传。
      # 每台设备只需装自己架构那一个（现代手机用 arm64-v8a 那个）。
      - name: 上传 release APK（按 ABI 分片）
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-release-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # --obfuscate 会把标识符名从 AOT 快照里去掉，所以崩溃栈必须靠这份符号还原。
      # 不上传的话线上崩溃就只能看到一堆 a/b/c，等于自断排查手段。
      # 用法：flutter symbolize -i <stack> -d <symbol 文件>
      - name: 上传 Dart 调试符号（还原混淆后的崩溃栈用）
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-symbols-${{ github.sha }}
          path: app/build/symbols/
          if-no-files-found: error

  # 独立的视觉基线 job：**故意**与 android job 分开。
  # - 只跑 app/test_visual/（不在 app/test/ 下，因此 android 的 `flutter test` 不会碰到它）；
  # - continue-on-error：它产出的是「待人工审阅的图片」，不该把流水线卡红；
  # - --update-goldens：首轮没有基线图，先重新生成、不比对（详见 app/test_visual/README.md）。
  visual:
    name: 视觉基线（golden，需人工审阅）
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      # 首轮基准：没有已提交的 golden，用 --update-goldens 直接生成。
      # 不接 `|| true`——玻璃分支依赖 GPU/着色器，headless 下可能失败，
      # 让这一步**红出来**以便定位，但整条流水线靠 job 级 continue-on-error 保持绿。
      - name: 生成视觉基线
        run: flutter test test_visual --update-goldens --reporter expanded

      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo "## 视觉基线（golden）"
            echo ""
            echo "本 job 只跑 \`app/test_visual/\`，产物是**待人工审阅的图片**，不是回归门禁。"
            echo ""
            echo "**能证明什么**：本仓库当前代码在固定尺寸下的渲染结果。"
            echo "**不能证明什么**：golden **不代表**「和参考项目长得一样」——"
            echo "它只能对照本仓库自己的历史基线，还原度仍要靠人看真机 + 参考实现。"
            echo ""
            echo "已知限制（审阅时请注意）："
            echo "- 测试环境不加载应用/系统字体，文字通常渲染为**方块**；请重点看布局、间距、几何、配色，"
            echo "不要为了好看往仓库塞大字体包。"
            echo "- \`LxSurface\` 玻璃分支只在 Cupertino/Oculus 真机命中，headless 无法触发；"
            echo "\`lx_surface_glass.png\` 用同一套公共参数直接绘制，仅供参考。"
            echo "- 玻璃依赖 GPU/驱动，不同机器像素可能有差异。"
            echo ""
            echo "这是**首轮基准**：请人工审阅图片，确认无误后再提交入库。"
            echo "产物名：\`lxplayer-visuals-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 与 android job 的 if-no-files-found: error 不同，这里用 warn：
      # 只要求「尽量拿到图」，缺某张图不该让 job 失败。
      - name: 上传视觉基线
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lxplayer-visuals-${{ github.sha }}
          path: app/test_visual/goldens
          if-no-files-found: warn
