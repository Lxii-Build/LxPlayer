# 4G 会在 debug 构建上不够用：run 57 就是 JetifyTransform 处理 Flutter 的
# armeabi_v7a_debug jar 时抛 "Java heap space"。GitHub 的 runner 有 16G 内存，
# 给到 6G 是安全的。
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# 关掉 Jetifier。它只为还在用旧 support library 的依赖做迁移，而这个项目的
# 依赖都已经是 AndroidX；开着只会让每个 jar 都多走一遍重写（正是上面那次 OOM
# 的现场），纯负担。哪天真的报出 support library 相关的错误，再打开它。
android.enableJetifier=false

# 新版 Flutter 默认开启 AGP 9 的新 DSL，而 Flutter Gradle 插件自身仍按旧 DSL 写，
# 两者相撞会直接构建失败（官方错误提示里就建议 opt out）。
# 等 Flutter 插件跟上 AGP 9 之后可以移除这一行。
android.newDsl=false

# 这里不能有 android.builtInKotlin=false：试过升 AGP 9.1.1 来解决 glance 的
# API 37 要求，但 AGP 9 同时删掉了 proguard-android.txt，而 flutter_inappwebview
# （已是最新 6.1.5）仍在使用它，插件方没适配。回到 AGP 8.11.1，改用锁低
# glance 版本的方式解决同一个问题。

# 让 Flutter Gradle 插件**不要**去写 defaultConfig.ndk.abiFilters，改由本项目的
# build.gradle.kts 按变体自行控制（release 只打 ARM，debug 保留全 ABI）。
#
# 为什么必须这样：Flutter 插件在 FlutterPlugin.kt 的 configureAbiWithoutSplits 里
# 会 `abiFilters.clear()` 再填上它支持的全部 ABI，直接覆盖 defaultConfig 里的设置；
# 而 `--target-platform` 只约束 Flutter 自身的 libapp.so / libflutter.so，
# **管不到插件的原生库**。实测：只加 --target-platform 时，APK 里 lib/x86_64
# 仍留着 libmpv.so(15.8MB)、libbarhopper.so(5.9MB) 等插件库共 21.1MB，对真机是死重量。
# 该开关是 Flutter 官方为此提供的入口（FlutterPluginUtils.kt: PROP_DISABLE_ABI_FILTERING）。
disable-abi-filtering=true
