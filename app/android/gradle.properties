org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# 新版 Flutter 默认开启 AGP 9 的新 DSL，而 Flutter Gradle 插件自身仍按旧 DSL 写，
# 两者相撞会直接构建失败（官方错误提示里就建议 opt out）。
# 等 Flutter 插件跟上 AGP 9 之后可以移除这一行。
android.newDsl=false

# 同理，AGP 9 默认内置 Kotlin，再显式应用 org.jetbrains.kotlin.android 会直接报错。
# 而 pub 上的 Flutter 插件每个都在自己的 build.gradle 里 apply 了它，逐个改不现实，
# 所以整体退回外部 KGP（settings.gradle.kts 里声明的 2.2.20）。
android.builtInKotlin=false

# home_widget 拖进来的 androidx.glance:glance-appwidget:1.3.0-alpha02 要求
# compile SDK 37，而 AGP 8.11.x 最高只支持 36，所以 AGP 必须升到 9.1.1（API 37
# 的最低要求版本）。
